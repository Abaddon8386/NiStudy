name: Việc kỹ thuật / tài liệu
description: Một việc kỹ thuật hoặc tài liệu không phải tính năng cho người dùng
title: "[Việc] "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi / file liên quan
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Tiêu chí xong
      placeholder: |
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Cách kiểm thử
    validations:
      required: false
