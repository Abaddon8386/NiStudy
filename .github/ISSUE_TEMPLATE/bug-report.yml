name: Báo lỗi
description: Báo một lỗi đã gặp khi dùng ứng dụng
title: "[Lỗi] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Mô tả
      description: Lỗi là gì, xảy ra ở màn hình nào?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Mở …
        2. Bấm …
        3. Thấy …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Thiết bị / trình duyệt
      multiple: true
      options:
        - Điện thoại Android
        - iPhone
        - Máy tính Chrome
        - Máy tính trình duyệt khác
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Ảnh chụp / log
      description: Không dán khóa API, mật khẩu hay token vào đây.
    validations:
      required: false
