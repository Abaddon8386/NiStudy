name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bật corepack (pnpm theo trường packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Quét gói build tìm khóa service role (NFR-13)
        run: |
          if grep -rIl -e 'service_role' -e 'SUPABASE_SERVICE_ROLE_KEY' .next/static; then
            echo "::error::Gói build trong .next/static chứa chuỗi khóa service role"
            exit 1
          fi
          echo "Không thấy chuỗi service role trong .next/static"

  e2e:
    name: E2E Playwright (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
